[project]
name = "firmware-campaign-controller"
version = "0.1.0"
description = "Durable firmware campaign controller and deterministic gateway simulator"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.15,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "prometheus-client>=0.21,<1",
    "pydantic-settings>=2.8,<3",
    "pyyaml>=6.0,<7",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-asyncio>=0.26,<2",
    "ruff>=0.11,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires dedicated PostgreSQL firmware_test database"]

# Preserve the supplied reference simulator byte-for-byte. Our controller/tests remain linted.
[tool.ruff]
extend-exclude = ["scripts/fw_simulator.py"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]
