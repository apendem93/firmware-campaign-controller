# Accelerated settings for the unchanged supplied simulator; retain normal settings for realistic timings.
services:
  migrate:
    volumes:
      - ./config.demo.yaml:/app/config.yaml:ro
  api:
    volumes:
      - ./config.demo.yaml:/app/config.yaml:ro
  worker:
    volumes:
      - ./config.demo.yaml:/app/config.yaml:ro
  simulator:
    environment:
      PERIODIC_INFORM_SEC: "30"
      DOWNLOAD_MIN_SEC: "0"
      DOWNLOAD_MAX_SEC: "1"
      REBOOT_MIN_SEC: "1"
      REBOOT_MAX_SEC: "3"
      LATE_EXTRA_SEC: "60"
